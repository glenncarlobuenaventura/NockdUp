<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NockdUp</title>
<meta name="description" content="Archery scoring, timer, records and share cards.">
<meta name="theme-color" content="#0B1120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NockdUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: phone-first shell, five-tab bar with a raised SHOOT button in the middle.
   Look: night-range ink with the target face's own colours (gold, red, blue, black, white) as the palette.
   Deliberately dark-only: target colours read best against ink. */
:root{
  --ink:#0B1120; --ink2:#111A2E; --ink3:#1A2744; --line:#27365F;
  --txt:#EDF1FA; --mute:#8E9CBE;
  --gold:#FFC93C; --red:#EA4B3F; --blue:#2E8BE8; --blk:#0B0C10; --wht:#F4F4F1; --miss:#9A6BFF; --good:#3DDC97;
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink)}
body{color:var(--txt);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 110px;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--txt)}
h1,h2,h3{font-family:var(--disp);font-weight:800;font-style:italic;letter-spacing:.01em;margin:0;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto}
.num,.big,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
.brand{font-family:var(--disp);font-style:italic;font-weight:800;font-size:26px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle,var(--gold) 0 28%,var(--red) 29% 52%,var(--blue) 53% 76%,#111 77% 100%);box-shadow:0 0 0 2px #ffffff22}
.brand b{color:var(--gold)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.pagehead h1{font-size:34px;line-height:1}
.sub{color:var(--mute);font-size:13px}

/* generic */
.card{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card.flat{background:transparent}
.card h3{font-size:20px;margin-bottom:10px}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.col{min-width:0}
.sp{flex:1}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;
  background:var(--ink3);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--gold);color:#241a00;border-color:var(--gold);font-family:var(--disp);font-style:italic;font-weight:800;font-size:20px;letter-spacing:.04em}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#04251a}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--gold);font-weight:600;font-size:13px;text-decoration:none}

.field{display:block;margin-bottom:12px;min-width:0}
.field input,.field select,.field textarea{width:100%;min-height:46px;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.field textarea{padding:10px 12px;min-height:90px}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);
  background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--ink);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--mute)}
.chip.on{background:var(--gold);color:#241a00;border-color:var(--gold)}
.lbl.bad{color:#ff8c82}
.lbl.bad::after{content:' · choose one';text-transform:none;letter-spacing:0}
.badl .lbl{color:#ff8c82}
.badl .lbl::after{content:' · choose one';text-transform:none;letter-spacing:0}
.badl select,.badl input{border-color:var(--red)}
.chips.badg,.seg.badg{outline:1.5px dashed var(--red);outline-offset:6px;border-radius:12px}
.warnbox.bad{background:#EA4B3F22;border-color:#EA4B3F;color:#ffb3ab;margin:0 0 12px}
.goals .lbl{min-height:2.8em;display:flex;align-items:flex-end}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
.field input,.field select{min-width:0;max-width:100%}
body{overflow-x:hidden}
.stab .lbl,.goals .lbl{min-height:2.8em;display:flex;align-items:flex-end}
.tile{position:relative}
.tile.ghit{border-color:#FFC93C99;background:linear-gradient(135deg,#FFC93C1f,var(--ink2) 70%)}
.trophy{position:absolute;bottom:12px;right:12px;width:26px;height:26px;color:var(--gold)}
.trophy.inl{position:static;width:18px;height:18px;vertical-align:-3px;margin-left:6px}
.gtiles{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:12px}
.gt{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.gt small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;white-space:nowrap}
.gt b{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.qm{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);font-weight:800;font-size:13px;line-height:1;display:inline-grid;place-items:center;flex:none;background:transparent}
.helpsteps{margin:10px 0 14px;padding-left:20px;display:grid;gap:6px;font-size:14px}
.calcres{font-family:var(--disp);font-weight:800;font-size:34px;color:var(--gold);min-height:40px}
.chips.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chips.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chips.three .chip{padding:0 2px;text-align:center;white-space:nowrap;min-width:0}
.chips.four .chip{padding:0 2px;text-align:center;white-space:nowrap;font-size:13.5px;min-width:0}
@media (max-width:360px){.chips.four .chip{font-size:12px}}
.chip.sq{border-radius:12px;min-width:56px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:10px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--ink3);color:var(--txt);box-shadow:inset 0 0 0 1px var(--gold)}

/* score discs */
.disc{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-family:var(--disp);font-weight:800;font-size:18px;line-height:1;flex:none}
.disc.s{width:26px;height:26px;font-size:14px}
.disc.l{width:46px;height:46px;font-size:24px}
.b-gold{background:var(--gold);color:#241a00}
.b-red{background:var(--red);color:#fff}
.b-blue{background:var(--blue);color:#fff}
.b-blk{background:var(--blk);color:#fff;box-shadow:inset 0 0 0 2px #ffffff55}
.b-wht{background:var(--wht);color:#111}
.b-miss{background:var(--miss);color:#fff}
.disc.empty{background:transparent;border:2px dashed var(--line);color:transparent}
.disc.sel{outline:3px solid #fff;outline-offset:2px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,#0B112000,#0B1120 28%);
  padding:14px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;align-items:end;background:var(--ink2);
  border:1px solid var(--line);border-radius:22px;padding:6px 4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;color:var(--mute);font-size:11px;font-weight:600;letter-spacing:.04em}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--gold)}
.fab{margin-top:-30px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--gold);font-family:var(--disp);font-weight:800;font-style:italic;font-size:14px;letter-spacing:.06em}
.fab span{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;border:4px solid var(--ink);
  background:radial-gradient(circle,#241a00 0 14%,var(--gold) 15% 100%);box-shadow:0 8px 24px #000a,0 0 0 2px var(--gold)}
.fab svg{width:34px;height:34px;fill:none;stroke:#241a00;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fab.on{color:#fff}

/* records */
.reel{position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);padding:20px 18px;margin-bottom:14px;
  background:linear-gradient(135deg,#16254A,#0F1830)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,var(--gold) 0 14%,#0000 14.5%),radial-gradient(circle,var(--gold) 0 29%,var(--red) 29.5% 43%,var(--blue) 43.5% 57%,#111 57.5% 71%,var(--wht) 71.5% 100%);
  opacity:.28;pointer-events:none}
.hero h2{font-size:40px;line-height:1}
.hero .sub{margin-top:6px;max-width:75%}
.pr{position:relative}
.pr header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pr header h3{margin:0;font-size:19px;flex:1}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--ink3);color:var(--mute)}
.tag.comp{background:#EA4B3F26;color:#ff8c82}
.tag.train{background:#2E8BE826;color:#7fbcff}
.big{font-family:var(--disp);font-weight:800;font-style:italic;font-size:62px;line-height:.95;color:var(--gold)}
.big small{font-size:20px;color:var(--mute);font-style:normal;font-weight:700;margin-left:6px}
.pct{font-family:var(--disp);font-weight:700;font-size:26px;color:var(--txt)}
.meta{color:var(--mute);font-size:13px;margin-top:6px}
.cmp{margin-top:8px;font-size:12.5px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap}
.cmp b{color:var(--txt)}
.brk{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.brk b{margin-right:10px;font-size:17px}
.empty{padding:22px 10px;text-align:center;color:var(--mute)}

/* stats */
.stats{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:6px;background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:10px 8px}
.st{text-align:center;min-width:0}
.st b{display:block;font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.05}
.st.main b{font-size:44px;color:var(--gold)}
.st small{font-size:10px;letter-spacing:.1em;color:var(--mute);font-weight:600;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.tile b{display:block;font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.05}
.tile small{display:block;font-size:11px;letter-spacing:.08em;color:var(--mute);font-weight:600;text-transform:uppercase}
.tile .go{margin-top:4px;display:block}
.hit{background:linear-gradient(90deg,#3DDC9722,#3DDC9708);border:1px solid #3DDC9766;color:var(--good);border-radius:14px;padding:10px 14px;font-weight:600;margin-bottom:12px}

/* ends */
.endrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:6px;align-items:center;width:100%;text-align:left;padding:8px 6px;border-radius:12px;border:1px solid transparent}
.endrow.sel{background:var(--ink3);border-color:var(--gold)}
.endrow .e{font-family:var(--disp);font-weight:800;color:var(--mute);font-size:16px}
.endrow .c{min-width:0}
.endrow .sc{font-family:var(--disp);font-weight:800;font-size:22px;min-width:34px;text-align:right}
.endrow .ac{display:grid;justify-items:end;line-height:1.15;min-width:46px;font-size:15px;font-weight:600}
.endrow .ac b{color:var(--mute);font-weight:600}
.endrow .ac small{font-size:11px;color:var(--mute);font-weight:400}
.endrow .rr{font-size:12px;color:var(--mute);min-width:46px;text-align:right}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.keypad.k6{grid-template-columns:repeat(4,1fr)}
.key{height:54px;border-radius:14px;font-family:var(--disp);font-weight:800;font-size:26px;display:grid;place-items:center}
.key:active{transform:scale(.94)}
.tgtbox{border:1px solid var(--line);border-radius:16px;background:#070b16;overflow:auto;max-height:76vh;touch-action:pan-x pan-y}
.tgtbox svg{display:block;touch-action:pan-x pan-y}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:8px}
.leg span{display:flex;align-items:center;gap:5px}
.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* timer */
.timer{border-radius:22px;padding:22px 16px;text-align:center;border:1px solid var(--line);transition:background .2s}
.timer.idle{background:var(--ink2)}
.timer.prep,.timer.done{background:#B3261E}
.timer.shoot{background:#14803F}
.timer.warn{background:#D98A00;color:#1d1300}
.timer .tl{font-family:var(--disp);font-weight:800;font-style:italic;font-size:22px;letter-spacing:.12em}
.timer .tc{font-family:var(--disp);font-weight:800;font-size:112px;line-height:1;font-variant-numeric:tabular-nums}

/* sheet / toast */
.sheetbg{position:fixed;inset:0;z-index:40;background:#050912d9;display:flex;align-items:flex-end;justify-content:center;
  padding-top:env(safe-area-inset-top,0px)}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--ink2);border:1px solid var(--line);border-radius:24px 24px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.sheet img.share{width:100%;border-radius:14px;display:block;margin-bottom:12px;background:#000}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:#fff;color:#111;
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:90%;box-shadow:0 8px 24px #0008}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--ink3);border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--disp);font-weight:800;font-size:34px;color:var(--mute);overflow:hidden;flex:none}
.avatar.sq{border-radius:20px}
.avatar img{width:100%;height:100%;object-fit:cover}
.item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--ink);margin-bottom:8px;width:100%;text-align:left}
.item .t{font-weight:600}
table.tb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
table.tb th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:right;padding:6px 6px;font-weight:600}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
.scrollx{overflow-x:auto}
.item.sel{border-color:var(--gold);background:var(--ink3)}
.photoask{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photoask .btn{justify-content:center;min-height:52px}
.field input.xdate{width:auto;flex:none;height:40px;min-height:40px;padding:0 10px;font-size:15px;text-align:left;-webkit-appearance:none;appearance:none}
.disc.xxs{width:17px;height:17px;font-size:11px}
table.tb.rounds{font-size:12.5px}
table.tb.rounds th{padding:6px 2px;font-size:10px;letter-spacing:.04em}
table.tb.rounds td{padding:6px 2px;vertical-align:middle}
table.tb.rounds .aline,table.tb.rounds .agrid{gap:2px}
table.tb.rounds th:nth-child(n+5),table.tb.rounds td:nth-child(n+5){padding-left:14px}
table.tb.rounds th:last-child,table.tb.rounds td:last-child{padding-left:8px;padding-right:0}
table.tb.rounds th:nth-child(2),table.tb.rounds td:nth-child(2){text-align:left;padding-left:6px}
table.tb.fit{table-layout:fixed;font-size:13px}
table.tb.fit th{font-size:9.5px;letter-spacing:.03em;padding:6px 2px;line-height:1.2;vertical-align:bottom}
table.tb.fit td{padding:8px 2px}
table.tb.fit th:first-child,table.tb.fit td:first-child{width:28%}
.cb{display:flex;align-items:center;gap:8px;min-height:36px;font-size:13.5px}
.cb input{width:20px;height:20px;accent-color:var(--gold)}
svg text{font-family:var(--body)}
.aline{display:flex;gap:3px;flex-wrap:nowrap;justify-content:flex-end}
.endrow .aline{justify-content:flex-start}
.agrid{display:grid;grid-template-columns:repeat(6,auto);gap:3px;justify-content:end}
.endrow .agrid{justify-content:start}
.disc.xs{width:22px;height:22px;font-size:13px}
.ctl{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin:2px 0 12px}
.ctl .btn{min-height:44px;padding:0 6px;font-size:14px;border-radius:12px}
.ctl .btn.pri,.ctl .btn.good{font-size:17px}
.kvr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.kvr b{text-align:right;min-width:0}
.warnbox{background:#D98A0026;border:1px solid #D98A0088;color:#ffd48a;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.big{font-size:52px}.key{font-size:22px;height:50px}.stats{grid-template-columns:1.4fr 1fr 1fr 1fr 1fr}.st b{font-size:22px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="layer"></div>
<noscript>NockdUp needs JavaScript turned on.</noscript>
<script>
(function(){'use strict';
//#LOGIC-START
const DISTS=[10,15,18,20,25,30,40,50,60,70,80,90];
const FACES=[
  {id:'40',label:'40cm',d:40},
  {id:'40t',label:'40cm Triangular',d:40,layout:'tri'},
  {id:'40v',label:'40cm Vertical',d:40,layout:'ver'},
  {id:'60',label:'60cm',d:60},
  {id:'60t',label:'60cm Triangular',d:60,layout:'tri'},
  {id:'60v',label:'60cm Vertical',d:60,layout:'ver'},
  {id:'80',label:'80cm',d:80},
  {id:'122',label:'122cm',d:122}
];
const DISC=['Recurve','Compound','Barebow'];
const SKILLS=['Beginner / Novice','Intermediate / Club Archer','Advanced / Competitive Archer','Elite / High-Performance'];
const TIMERS={

function faceInfo(id){id=({'40h':'40v','60h':'60v'})[id]||id;return FACES.find(f=>f.id===id)||FACES[0];}
function spotsOf(f){
  const L=f.d*1.08;
  if(f.layout==='tri')return[[0,-L*.577],[-L/2,L*.289],[L/2,L*.289]];
  if(f.layout==='ver')return[[0,-L],[0,0],[0,L]];
  return[[0,0]];
}
function ringW(f,rings){return f.d/(2*rings);}
function scorePoint(f,rings,x,y){
  const sp=spotsOf(f);let bi=0,bd=1e9;
  sp.forEach((s,i)=>{const d=Math.hypot(x-s[0],y-s[1]);if(d<bd){bd=d;bi=i;}});
  const rw=ringW(f,rings),re=Math.max(0,bd-0.275);let v;
  if(re>rings*rw)v='M';
  else{const idx=Math.min(rings-1,Math.floor(re/rw));v=10-idx;if(v===10&&re<=rw/2)v='X';}
  return{v,spot:bi};
}
function endRadius(end,s){
  const f=faceInfo(s.face),sp=spotsOf(f),A=end.arrows;
  if(A.length<2||A.some(a=>a.x==null))return null;
  const pts=A.map(a=>{const c=sp[a.spot||0]||sp[0];return[a.x-c[0],a.y-c[1]];});
  const mx=avg(pts.map(p=>p[0])),my=avg(pts.map(p=>p[1]));
  return avg(pts.map(p=>Math.hypot(p[0]-mx,p[1]-my)));
}
function endStat(e){
  let sc=0,x=0,t=0,k=0,n=0;
  for(const a of e.arrows){sc+=num(a.v);n++;if(a.v==='X')x++;else if(a.v===10)t++;else if(a.v===9)k++;}
  return{sc,x,t,k,g:x+t,y:x+t+k,n};
}
function shootStats(s){
  let sc=0,x=0,g=0,y=0,n=0,rs=[],best=null,bestR=null,ne=0;
  s.ends.forEach((e,i)=>{
    if(!e.arrows.length)return;
    const st=endStat(e);sc+=st.sc;x+=st.x;g+=st.g;y+=st.y;n+=st.n;ne++;
    const r=endRadius(e,s);
    if(r!=null){rs.push(r);if(bestR==null||r<bestR)bestR=r;}
    if(!best||st.sc>best.sc)best={sc:st.sc,idx:i};
  });
  return{score:sc,x,g,y,n,ends:ne,avgR:rs.length?avg(rs):null,bestEnd:best,bestR};
}
function unitsOf(s){
  /* Distances are counted by arrows: 1st = arrows 1-36, 2nd = 37-72, 3rd = 73-108.
     Double = arrows 1-72. When the 3rd distance is finished (108 arrows) the double is the best of 1+2, 2+3 and 1+3.
     An unfinished 3rd distance counts toward the accumulated score only, never toward a distance. */
  const comp=s.type==='competition',flat=[],endIdx=[];
  s.ends.forEach((e,i)=>e.arrows.forEach(a=>{flat.push(a);endIdx.push(i);}));
  const N=flat.length;if(N<36)return[];
  const radii=s.ends.map(e=>endRadius(e,s));
  const slice=(a,b)=>{let sc=0,x=0,t=0,k=0;for(let i=a;i<b;i++){const v=flat[i].v;sc+=num(v);if(v==='X')x++;else if(v===10)t++;else if(v===9)k++;}return{sc,x,t,k};};
  const rad=rg=>{const set=new Set();rg.forEach(([a,b])=>{for(let i=a;i<b;i++)set.add(endIdx[i]);});const r=[...set].map(i=>radii[i]).filter(v=>v!=null);return r.length?avg(r):null;};
  const mk=(rg,kind,idx,f,denom,pair)=>{const q={sc:0,x:0,t:0,k:0};rg.forEach(([a,b])=>{const z=slice(a,b);q.sc+=z.sc;q.x+=z.x;q.t+=z.t;q.k+=z.k;});const r=v=>round1(v*f);
    return{kind,idx,pair:pair||'',score:r(q.sc),x:r(q.x),t:r(q.t),k:r(q.k),g:r(q.x+q.t),y:r(q.x+q.t+q.k),denom,norm:f!==1,comp,sid:s.id,date:s.startedAt,disc:s.discipline,rad:rad(rg)};};
  const out=[];
  if(N<72){
    if(N===36)out.push(mk([[0,36]],'single',1,1,36));
    else out.push(mk([[0,N]],'single',1,36/N,36));
    return out;
  }
  const R=[[0,36],[36,72],[72,108]];
  out.push(mk([R[0]],'single',1,1,36));
  out.push(mk([R[1]],'single',2,1,36));
  if(N>=108){
    out.push(mk([R[2]],'single',3,1,36));
    const cand=[[[R[0],R[1]],'1+2'],[[R[1],R[2]],'2+3'],[[R[0],R[2]],'1+3']].map(c=>mk(c[0],'double',0,1,72,c[1]));
    out.push(cand.reduce((b,u)=>u.score>b.score?u:b));
  }else out.push(mk([R[0],R[1]],'double',0,1,72,'1+2'));
  return out;
}
/* progress-only distance chunks: arrows 1-36 = 1st, 37-72 = 2nd, 73-108 = 3rd, counting whatever is finished (never used for records) */
function chunksOf(s){
  const flat=[],endIdx=[];
  s.ends.forEach((e,i)=>e.arrows.forEach(a=>{flat.push(a);endIdx.push(i);}));
  const N=flat.length;if(!N)return[];
  const radii=s.ends.map(e=>endRadius(e,s));
  const mk=(a,b,idx)=>{if(a>=N)return null;b=Math.min(b,N);let sc=0;const set=new Set();
    for(let i=a;i<b;i++){sc+=num(flat[i].v);set.add(endIdx[i]);}
    const r=[...set].map(i=>radii[i]).filter(v=>v!=null);
    return{idx,score:sc,rad:r.length?avg(r):null};};
  return[mk(0,36,1),mk(36,72,2),mk(72,108,3)].filter(Boolean);
}
/* accumulated score inside the 2nd distance (arrows 37-72), per end; null for ends outside it */
function d2Info(s){
  const out=[];let n=0,acc=0;
  s.ends.forEach(e=>{const a0=n;n+=e.arrows.length;
    if(!e.arrows.length||a0<36||a0>=72){out.push(null);return;}
    acc+=endStat(e).sc;out.push(acc);});
  return out;
}
/* accumulated score inside the 3rd distance (arrows 73-108), per end; null for ends outside it */
function d3Info(s){
  const out=[];let n=0,acc=0;
  s.ends.forEach(e=>{const a0=n;n+=e.arrows.length;
    if(!e.arrows.length||a0<72||a0>=108){out.push(null);return;}
    acc+=endStat(e).sc;out.push(acc);});
  return out;
}

function dkey(d){d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromKey(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(k,n){const d=fromKey(k);d.setDate(d.getDate()+n);return dkey(d);}
function weekStart(k){const d=fromKey(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d);}

/* per-day / per-period metrics */
function dayMetrics(list){
  const ends=[];let score=0,x=0,g=0,y=0,arrows=0,units=[],chunks=[],best=null,minR=null,maxR=null,rs=[];
  list.forEach(s=>{
    s.ends.forEach((e,i)=>{
      if(!e.arrows.length)return;
      const st=endStat(e),r=endRadius(e,s);
      score+=st.sc;x+=st.x;g+=st.g;y+=st.y;arrows+=st.n;
      if(r!=null){rs.push(r);if(!minR||r<minR.r)minR={r,date:s.startedAt,sid:s.id};if(!maxR||r>maxR.r)maxR={r,date:s.startedAt,sid:s.id};}
      if(!best||st.sc>best.sc)best={sc:st.sc,date:s.startedAt,sid:s.id,idx:i};
      ends.push({sid:s.id,idx:i,sc:st.sc,r,arrows:e.arrows,date:s.startedAt});
    });
    units=units.concat(unitsOf(s));
    chunks=chunks.concat(chunksOf(s));
  });
  const singles=units.filter(u=>u.kind==='single'),doubles=units.filter(u=>u.kind==='double');
  const hi=a=>a.length?Math.max(...a.map(u=>u.score)):null,lo=a=>a.length?Math.min(...a.map(u=>u.score)):null;
  const c1=chunks.filter(u=>u.idx===1),c2=chunks.filter(u=>u.idx===2),c3=chunks.filter(u=>u.idx===3);
  const pickU=(a,f)=>a.length?a.reduce((b,u)=>f(u.score,b.score)?u:b):null;
  return{sHiU:pickU(singles,(a,b)=>a>b),sLoU:pickU(singles,(a,b)=>a<b),arrows,score,x,g,y,ends,units,singles,doubles,bestEnd:best,minR,maxR,avgR:rs.length?avg(rs):null,
    sHi:hi(singles),sLo:lo(singles),dHi:hi(doubles),dLo:lo(doubles),first:hi(c1),second:hi(c2),third:hi(c3),
    avgSingle:singles.length?avg(singles.map(u=>u.score)):null,avgDouble:doubles.length?avg(doubles.map(u=>u.score)):null,
    rpd:(function(){const r=chunks.map(u=>u.rad).filter(v=>v!=null);return r.length?avg(r):null;})()};
}
function goalsHit(dm,goals){
  const g=k=>goals&&goals[k]!==''&&goals[k]!=null&&+goals[k]>0?+goals[k]:null;
  return{single:g('single')!=null&&dm.sHi!=null&&dm.sHi>=g('single'),
    double:g('double')!=null&&dm.dHi!=null&&dm.dHi>=g('double'),
    arrows:g('arrows')!=null&&dm.arrows>=g('arrows')};
}
/* personal records */
function bestUnit(units,key){
  let b=null;
  units.forEach(u=>{const v=u[key];if(!b||v>b[key]||(v===b[key]&&u.date<b.date))b=u;});
  return b;
}
function prSet(disc,shoots){
  const S=shoots.filter(s=>s.done&&s.discipline===disc);
  const U=[];S.forEach(s=>unitsOf(s).forEach(u=>U.push(u)));
  const single=U.filter(u=>u.kind==='single'),dbl=U.filter(u=>u.kind==='double');
  const pack=(arr,key)=>({
    best:bestUnit(arr,key),
    comp:bestUnit(arr.filter(u=>u.comp),key),
    train:bestUnit(arr.filter(u=>!u.comp),key)
  });
  let grp=null;
  S.forEach(s=>{
    const f=faceInfo(s.face),rw=ringW(f,s.rings),sc=6.1/rw,sp=spotsOf(f);
    s.ends.forEach((e,i)=>{
      const r=endRadius(e,s);if(r==null)return;
      const r122=r*sc;
      if(!grp||r122<grp.r||(r122===grp.r&&s.startedAt<grp.date)){
        const pts=e.arrows.map(a=>{const c=sp[a.spot||0]||sp[0];return{x:(a.x-c[0])*sc,y:(a.y-c[1])*sc,v:a.v};});
        grp={r:r122,raw:r,faceLbl:f.label,rings:s.rings,dist:s.distance,sid:s.id,date:s.startedAt,idx:i,pts,comp:s.type==='competition'};
      }
    });
  });
  /* best grouping of a whole shoot: lowest average end radius over a shoot with at least 36 plotted arrows, compared on the 122cm-equivalent so different targets are fair */
  let grpS=null;
  S.forEach(s=>{
    const f=faceInfo(s.face),sc=6.1/ringW(f,s.rings),rs=[];let na=0;
    s.ends.forEach(e=>{const r=endRadius(e,s);if(r!=null){rs.push(r);na+=e.arrows.length;}});
    if(na<36)return;
    const raw=avg(rs),nr=raw*sc;
    if(!grpS||nr<grpS.r||(nr===grpS.r&&s.startedAt<grpS.date))grpS={r:nr,raw,faceLbl:f.label,rings:s.rings,dist:s.distance,sid:s.id,date:s.startedAt,ends:rs.length,arrows:na,comp:s.type==='competition'};
  });
  return{grpS,dScore:pack(dbl,'score'),sScore:pack(single,'score'),
    sX:pack(single,'x'),dX:pack(dbl,'x'),sG:pack(single,'g'),dG:pack(dbl,'g'),sY:pack(single,'y'),dY:pack(dbl,'y'),grp,
    count:S.length};
}

function lineChart(o){

  const X=i=>L+14+(n===1?(W-L-R-28)/2:i*(W-L-R-28)/(n-1)),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));

  series.forEach(s=>{

    s.vals.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true;last=i;});
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    s.vals.forEach((v,i)=>{if(v!=null)g+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(i===last?4.5:3)+'" fill="'+s.color+'" stroke="#111A2E" stroke-width="1.5"/>';});

    const ly=i=>{const v=s.vals[i];let p=null,q=null;

      for(let k=i+1;k<n;k++)if(s.vals[k]!=null){q=s.vals[k];break;}
      const nb=[p,q].filter(z=>z!=null);let below=false;
      if(nb.length){const m=nb.reduce((a,c)=>a+c,0)/nb.length;below=m>v;}
      const yb=Y(v)+17;if(below&&yb>H-B+2)below=false;

    const lt=(x,y,sz,v)=>'<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="'+sz+'" font-weight="700" fill="'+s.color+'" stroke="#111A2E" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">'+fmtN(v)+'</text>';
    if(o.labelAll){s.vals.forEach((v,i)=>{if(v!=null)g+=lt(X(i),ly(i),10.5,v);});}
    else if(last!=null)g+=lt(Math.min(X(last),W-R-8),ly(last),11,s.vals[last]);
  });
  const leg=series.length>1?'<div class="leg">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')+'</div>':'';
  const svg='<svg viewBox="0 0 '+W+' '+H+'" style="'+(W>340?'width:'+W+'px;max-width:none;':'width:100%;')+'height:auto" role="img" aria-label="'+esc(o.title||'Chart')+'">'+g+'</svg>';
  return(W>340?'<div class="scrollx"'+(o.sync?' data-sync="'+o.sync+'"':'')+'>'+svg+'</div>':svg)+leg;

const T={stage:'idle',end:0,iv:null,ac:null,wl:null,cfg:null};
function audio(fresh){
  /* fresh=true is used on START (a tap): a brand-new context, so a context the phone suspended or interrupted can never leave a later end silent */
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    if(fresh||!T.ac||T.ac.state==='closed'){
      if(T.ac){try{T.ac.close();}catch(e){}}
      T.ac=new C();
      try{const b=T.ac.createBuffer(1,1,22050),n=T.ac.createBufferSource();n.buffer=b;n.connect(T.ac.destination);n.start(0);}catch(e){}
    }

  }catch(e){}
  return T.ac;
}
function blast(t0,ac){
  ac=ac||T.ac;if(!ac)return;
  const out=ac.createGain();out.gain.setValueAtTime(0,t0);out.gain.linearRampToValueAtTime(.55,t0+.02);out.gain.setValueAtTime(.55,t0+.3);out.gain.linearRampToValueAtTime(0,t0+.36);out.connect(ac.destination);
  const am=ac.createGain();am.gain.value=.55;am.connect(out);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=34;lg.gain.value=.45;lfo.connect(lg);lg.connect(am.gain);
  [2860,3040].forEach(fr=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=fr;o.connect(am);o.start(t0);o.stop(t0+.4);});
  lfo.start(t0);lfo.stop(t0+.4);
  const nb=ac.createBuffer(1,Math.floor(ac.sampleRate*.4),ac.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

}
function whistle(n){

  if(ac.state==='running'){play(ac);return;}
  try{ac.resume().then(()=>play(ac)).catch(()=>{});}catch(e){}
  setTimeout(()=>{if(!played){const a2=audio(true);if(a2)play(a2);}},700);
}

function periodRange(){
  const P=U.prog;
  if(P.mode==='day')return[P.day,P.day];
  if(P.mode==='week'){const a=weekStart(P.day);return[a,addDays(a,6)];}
  if(P.mode==='month'){const d=fromKey(P.day);return[dkey(new Date(d.getFullYear(),d.getMonth(),1)),dkey(new Date(d.getFullYear(),d.getMonth()+1,0))];}
  const ds=S.shoots.filter(s=>s.done).map(s=>dkey(s.startedAt)).sort();
  return ds.length?[ds[0],ds[ds.length-1]]:[todayKey(),todayKey()];
}
function periodLabel(){
  const P=U.prog,[a,b]=periodRange();
  if(P.mode==='day')return a===todayKey()?'Today · '+fmtKey(a):fmtKey(a);
  if(P.mode==='week')return fmtKey(a)+' – '+fmtKey(b);
  if(P.mode==='month')return MONL[fromKey(a).getMonth()]+' '+fromKey(a).getFullYear();
  return'All time';
}
function analyze(){
  const[a,b]=periodRange();
  const list=S.shoots.filter(s=>s.done&&dkey(s.startedAt)>=a&&dkey(s.startedAt)<=b);
  const byDay={};list.forEach(s=>{const k=dkey(s.startedAt);(byDay[k]=byDay[k]||[]).push(s);});
  const dms={};Object.keys(byDay).forEach(k=>{dms[k]=dayMetrics(byDay[k]);});
  const all=dayMetrics(list),days=[],keys=Object.keys(dms).sort();
  if(U.prog.mode==='week'||U.prog.mode==='month')for(let k=a;k<=b;k=addDays(k,1))days.push(k);
  else if(U.prog.mode==='all')keys.slice(-30).forEach(k=>days.push(k));
  let minAvg=null;Object.keys(dms).forEach(k=>{const v=dms[k].avgR;if(v!=null&&(!minAvg||v<minAvg.v))minAvg={v,k};});
  const goalDays=Object.keys(dms).filter(k=>{const g=goalsHit(dms[k],S.goals);return g.single||g.double||g.arrows;});
  let chart;
  if(U.prog.mode==='day')chart={name:'Score',labels:all.ends.map((e,i)=>'E'+(i+1)),vals:all.ends.map(e=>e.sc)};
  else chart={name:'Accumulated score per day',labels:days.map(k=>fromKey(k).getDate()+'/'+(fromKey(k).getMonth()+1)),vals:days.map(k=>dms[k]?dms[k].score:null)};
  const chart2=U.prog.mode==='day'?{name:'Grouping (cm)',labels:all.ends.map((e,i)=>'E'+(i+1)),vals:all.ends.map(e=>e.r)}:null;
  return{a,b,list,byDay,dms,all,days,minAvg,goalDays,keys,chart,chart2,bs:bestUnit(all.singles,'score'),bd:bestUnit(all.doubles,'score')};
}

async function downloadBlob(file){
  try{const dl=await cap('downloads');if(dl){await dl.save({filename:file.name,data:file});return true;}}catch(e){if(e&&e.code==='declined')return false;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),6000);return true;}catch(e){return false;}
}
/* call straight from a tap: the phone's share sheet only opens during a tap */
function sendFile(file,title){
  if(canShareFiles(file)){
    return navigator.share({files:[file],title:title||'NockdUp'}).then(()=>true).catch(e=>(e&&e.name==='AbortError')?false:downloadBlob(file));
  }
  return downloadBlob(file);
}

/* week / month picker: every week or month from the first shoot (at least the last 12) up to the current one, so new ones appear as time goes on */
function periodOptions(){
  const P=U.prog,done=S.shoots.filter(s=>s.done),keys=done.map(s=>dkey(s.startedAt)).sort(),today=todayKey(),out=[];
  const cnt=(a,b)=>done.filter(s=>{const k=dkey(s.startedAt);return k>=a&&k<=b;}).length;
  const mStart=k=>{const d=fromKey(k);return dkey(new Date(d.getFullYear(),d.getMonth(),1));};
  if(P.mode==='month'){
    const t=fromKey(today),first=keys.length?fromKey(keys[0]):t;
    const start=new Date(Math.min(new Date(first.getFullYear(),first.getMonth(),1),new Date(t.getFullYear(),t.getMonth()-11,1)));
    const top=fromKey(mStart(P.day>today?P.day:today));
    for(let d=top,i=0;d>=start&&i<400;d=new Date(d.getFullYear(),d.getMonth()-1,1),i++){
      const a=dkey(d),b=dkey(new Date(d.getFullYear(),d.getMonth()+1,0));
      out.push({k:a,l:MONL[d.getMonth()]+' '+d.getFullYear(),n:cnt(a,b),cur:a===mStart(today),sel:a===mStart(P.day)});
    }
  }else{
    const cw=weekStart(today),fw=keys.length?weekStart(keys[0]):cw,s0=addDays(cw,-77),start=fw<s0?fw:s0;
    for(let a=weekStart(P.day>today?P.day:today),i=0;a>=start&&i<400;a=addDays(a,-7),i++){
      const b=addDays(a,6);
      out.push({k:a,l:fmtKey(a)+' – '+fmtKey(b),n:cnt(a,b),cur:a===cw,sel:a===weekStart(P.day)});
    }
  }
  return out;
}

function askAdd(txt){
  let d;try{d=JSON.parse(txt);}catch(e){toast('That does not look like NockdUp shoots.');return;}
  const list=d&&Array.isArray(d.shoots)?d.shoots.filter(x=>x&&typeof x.id==='string'&&x.startedAt&&Array.isArray(x.ends)&&x.ends.length):[];
  if(!list.length){toast('No shoots found in that file.');return;}
  const have=new Set(S.shoots.map(x=>x.id)),fresh=list.filter(x=>!have.has(x.id)),dup=list.length-fresh.length;
  U.pendingAdd=fresh;
  const byDay={};fresh.forEach(x=>{const k=dkey(x.startedAt);byDay[k]=(byDay[k]||0)+1;});
  openSheet('<h3>Add these shoots?</h3><div class="sub" style="margin:8px 0 14px">'+(fresh.length?fresh.length+' new shoot'+(fresh.length===1?'':'s')+' will be added to this phone: '+Object.keys(byDay).sort().map(k=>fmtKey(k)+' ('+byDay[k]+')').join(', ')+'.':'Every shoot in this file is already on this phone.')+(dup&&fresh.length?' '+dup+' already here will be skipped.':'')+' Your other data is not changed.</div><div class="row">'+(fresh.length?'<button class="btn pri" data-act="doAdd">ADD '+fresh.length+' SHOOT'+(fresh.length===1?'':'S')+'</button>':'')+'<button class="btn ghost" data-act="closeSheet">'+(fresh.length?'Cancel':'Close')+'</button></div>');
}
ACT.doAdd=()=>{
  const fresh=U.pendingAdd||[];U.pendingAdd=null;
  fresh.forEach(x=>{const o=JSON.parse(JSON.stringify(x));o.done=true;if(o.eq&&!getEquip(o.eq))o.eq='';if(o.ar&&!getArrow(o.ar))o.ar='';S.shoots.push(o);});
  saveNow();closeSheet();render();toast(fresh.length+' shoot'+(fresh.length===1?'':'s')+' added');
};
function askRestore(txt){
  let d;try{d=JSON.parse(txt);}catch(e){toast('That does not look like a NockdUp backup.');return;}
  if(!d||!Array.isArray(d.shoots)){toast('That does not look like a NockdUp backup.');return;}
  U.pending=d;
  openSheet('<h3>Replace your data?</h3><div class="sub" style="margin:8px 0 14px">This backup has '+d.shoots.length+' shoot'+(d.shoots.length===1?'':'s')+'. Restoring replaces everything on this device.</div><div class="row"><button class="btn red" data-act="doRestore">Replace my data</button><button class="btn ghost" data-act="closeSheet">Cancel</button></div>');

/* ---------- render + events ---------- */
function render(){
  stopReel();
  const tb=document.querySelector('.tgtbox'),pos=tb?[tb.scrollLeft,tb.scrollTop]:null,sc=U.screen;
  let h;
  if(sc&&sc.name==='active')h=viewActive();
  else if(sc&&sc.name==='summary')h=viewSummary(sc.sid);
  else if(sc&&sc.name==='equip')h=viewEquip(sc.id);
  else if(sc&&sc.name==='arrow')h=viewArrow(sc.id);
  else h=({records:viewRecords,progress:viewProgress,shoot:viewShoot,profile:viewProfile,connect:viewConnect})[U.tab]();
  $('app').innerHTML=h;
  paintTabs();
  const nb=document.querySelector('.tgtbox');
  if(nb){
    if(zoomKeep){nb.scrollLeft=zoomKeep.fx*nb.scrollWidth-nb.clientWidth/2;nb.scrollTop=zoomKeep.fy*nb.scrollHeight-nb.clientHeight/2;zoomKeep=null;}
    else if(pos){nb.scrollLeft=pos[0];nb.scrollTop=pos[1];}
    else{nb.scrollLeft=(nb.scrollWidth-nb.clientWidth)/2;nb.scrollTop=(nb.scrollHeight-nb.clientHeight)/2;}
  }
  if(!U.screen&&U.tab==='records')startReel();
  if(!U.screen&&U.tab==='connect')fillStorage();
  if(U.screen&&U.screen.name==='active'&&U.phase==='timer'&&!U.editing)paintTimer();
}

  const b=el.dataset&&el.dataset.b;if(!b)return;

  if(sc==='scfg'){const n=parseInt(String(el.value).replace(/\D/g,''),10);if(n>=0&&n<=3600){o[p]=n;save();if(T.stage==='idle')paintTimer();}return;}
  setPath(o,p,el.value);save();

  else if(ds.addfile){const f=el.files&&el.files[0];if(f){const r=new FileReader();r.onload=()=>askAdd(String(r.result));r.readAsText(f);}el.value='';}
  else if(ds.restore){const f=el.files&&el.files[0];if(f){const r=new FileReader();r.onload=()=>askRestore(String(r.result));r.readAsText(f);}el.value='';}
});
